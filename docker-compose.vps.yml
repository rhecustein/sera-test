version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: sera_redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --port 60012 --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '60012', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Aktifkan jika tidak pakai postgres existing di host
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: sera_postgres
  #   restart: unless-stopped
  #   network_mode: host
  #   env_file:
  #     - .env.production
  #   environment:
  #     PGPORT: 60013
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sera_app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:60010/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sera_frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app

volumes:
  redis_data:
  # postgres_data:
