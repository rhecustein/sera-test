version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: sera_redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '6379', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sera_app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:60010/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: sera_frontend
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: sera_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - frontend

volumes:
  redis_data:
