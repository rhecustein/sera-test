name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sera_test
          POSTGRES_USER: sera_user
          POSTGRES_PASSWORD: sera_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 60010
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sera_test
      DB_USER: sera_user
      DB_PASS: sera_password
      JWT_SECRET: ci-test-secret-minimum-32-characters-long
      JWT_EXPIRES_IN: 1h
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 465
      MAIL_SECURE: "false"
      MAIL_USER: test@example.com
      MAIL_PASS: test-password
      MAIL_FROM: "SERA Test <test@example.com>"
      CORS_ORIGIN: "http://localhost:60011"
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target production -t sera-backend:ci .

      - name: Build frontend image
        run: docker build -t sera-frontend:ci ./frontend

      - name: Verify images
        run: docker images | grep sera

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/sera
            git pull origin main
            docker compose pull 2>/dev/null || true
            docker compose up -d --build
            docker compose ps
